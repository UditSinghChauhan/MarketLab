name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: TypeScript workspace (typecheck, lint, format, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketlab
          POSTGRES_PASSWORD: marketlab
          POSTGRES_DB: marketlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests with coverage
        run: npm run coverage
        env:
          TEST_DATABASE_URL: postgres://marketlab:marketlab@localhost:5432/marketlab
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const cell = (m) => `${m.pct}% (${m.covered}/${m.total})`;
            console.log("### Unit test coverage\n");
            console.log("| Lines | Statements | Branches | Functions |");
            console.log("| --- | --- | --- | --- |");
            console.log(`| ${[t.lines, t.statements, t.branches, t.functions].map(cell).join(" | ")} |`);
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage
          retention-days: 14

      # The certificate tests need a server with TLS, which the service above lacks.
      # They are skipped without one, so this step fails if any of them did not run.
      - name: Start PostgreSQL with TLS
        run: scripts/postgres-tls.sh
      - name: TLS connection tests
        env:
          TEST_DATABASE_TLS_URL: postgres://marketlab:marketlab@localhost:5433/marketlab
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.tls/ca.crt
        run: |
          npx vitest run apps/api/src/log/connection.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=tls-results.json
          jq -e '.numPendingTests == 0 and .numTodoTests == 0 and .numFailedTests == 0 and .numPassedTests > 0' \
            tls-results.json > /dev/null || { echo "::error::TLS connection tests were skipped"; exit 1; }

      - run: npm run build

      # The built server, as Render runs it, against the Postgres service above.
      - name: Smoke test the production build
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://marketlab:marketlab@localhost:5432/marketlab
          TOKEN_SECRET: ci-only-secret-0123456789abcdef0123456789
          PORT: "8080"
          LOG_LEVEL: warn
          WARMUP_MINUTES: "5"
        run: |
          set -euo pipefail
          base=http://localhost:8080
          fail() { echo "FAILED: $1"; exit 1; }
          start() {
            npm start > server.log 2>&1 &
            for _ in $(seq 1 60); do
              curl -sf "$base/api/health" > health.json && return 0
              sleep 0.5
            done
            cat server.log; fail "server did not become healthy"
          }
          stop() { pkill -TERM -f "dist/server.js" || true; while pgrep -f "dist/server.js" > /dev/null; do sleep 0.2; done; }

          start
          grep -q '"status":"ok"' health.json || fail "health is not ok"
          grep -q '"persistence":"postgres"' health.json || fail "not using Postgres"
          grep -q '"invariantViolations":0' health.json || fail "invariant violations"

          [ "$(curl -s -o body.json -w '%{http_code} %{content_type}' "$base/api/no-such-route")" = "404 application/json; charset=utf-8" ] || fail "unknown API route is not a JSON 404"
          grep -q '"code":"not_found"' body.json || fail "404 body has no error code"

          [ "$(curl -s -o page.html -w '%{http_code}' "$base/terminal/ORBT")" = "200" ] || fail "deep link did not return 200"
          grep -q '<div id="root">' page.html || fail "deep link did not serve the app"

          curl -s -D headers.txt -o /dev/null -H 'Accept-Encoding: br' "$base/"
          grep -qi '^content-security-policy:' headers.txt || fail "no Content-Security-Policy"
          grep -qi '^x-content-type-options: nosniff' headers.txt || fail "no X-Content-Type-Options"
          grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains' headers.txt || fail "no Strict-Transport-Security"
          script=$(grep -o '/assets/index-[^"]*\.js' page.html | head -1)
          curl -s -D headers.txt -o /dev/null -H 'Accept-Encoding: br' "$base$script"
          grep -qi '^content-encoding: br' headers.txt || fail "assets are not compressed"

          # A clean stop stores a snapshot; the next start restores it instead of replaying.
          stop; start
          grep -Eq '"snapshotSeq":[1-9]' health.json || fail "restart did not use a snapshot"

          # When the log cannot be written, requests get 503 and the process exits for a restart.
          psql "$DATABASE_URL" -qc 'ALTER TABLE log_entries RENAME TO log_entries_gone'
          [ "$(curl -s -o body.json -w '%{http_code}' -X POST "$base/api/session")" = "503" ] || fail "an unwritable log did not answer 503"
          for _ in $(seq 1 20); do pgrep -f "dist/server.js" > /dev/null || break; sleep 0.5; done
          pgrep -f "dist/server.js" > /dev/null && fail "server kept running with an unwritable log"
          echo "Smoke test passed"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
